<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;600;900&display=swap" rel="stylesheet">
<style>
    html, body {
        margin: 0;
        overflow: hidden;
        height: 100%;
        background: radial-gradient(circle at center, #1a1a2e, #16213e, #0f3460);
        font-family: 'Exo 2', sans-serif;
        color: white;
        user-select: none;

    }

    #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        z-index: 1;
        touch-action: none;
    }

    #particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
    }

    #hud {
        position: fixed;
        top: 84px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
        text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        width: 100%;
    }

    #score {
        font-size: 48px;
        font-weight: 900;
        color: #fff;
        margin: 0;
        line-height: 1;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #details {
        font-size: 16px;
        color: #aeb8c7;
        margin-top: 4px;
        font-weight: 300;
        letter-spacing: 1px;
    }

    @media (min-width: 768px) {
        #hud { top: 90px; }
        #score { font-size: 64px; }
        #details { font-size: 18px; }
    }

    #leaderboard {
        margin-top: 15px;
        font-size: 14px;
        color: #8892b0;
        background: rgba(0, 0, 0, 0.3);
        padding: 10px 20px;
        border-radius: 20px;
        display: inline-block;
        backdrop-filter: blur(4px);
    }

    #instructions {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 28px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.6);
        pointer-events: none;
        animation: breathe 3s infinite ease-in-out;
    }

    @keyframes breathe {
        0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.95); }
        50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Pop animation for high scores */
    @keyframes pop {
        0% { transform: scale(0.8); opacity: 0; }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); opacity: 1; }
    }
    
    .high-score-anim {
        animation: pop 0.5s forwards;
        color: #ffd700 !important; /* Gold */
        text-shadow: 0 0 20px #ffd700;
    }
    .toolbar { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .toolbar a, .toolbar button, .toolbar select { font: inherit; color: white; background: #14243c; border: 1px solid #718298; padding: 10px; border-radius: 12px; min-height: 44px; text-decoration: none; }
    .toolbar select option { color: white; background: #14243c; }
    .toolbar div { display: flex; gap: 6px; }
    :focus-visible { outline: 3px solid #ffd700; outline-offset: 3px; }
    #instructions { z-index: 3; width: calc(100% - 30px); }
    #instructions[hidden] { display: none; }
    #details { max-width: calc(100% - 28px); margin: 8px auto; }
    .draw-note { position: fixed; z-index: 3; pointer-events: none; bottom: max(14px, env(safe-area-inset-bottom)); left: 16px; right: 16px; text-align: center; font-size: 13px; color: #c5d1e0; }
    @media (max-height: 500px) { #hud { top: 68px; } #score { font-size: 36px; } #leaderboard { margin-top: 4px; padding: 5px 12px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<body>

<nav class="toolbar" aria-label="Game controls"><a id="back" href="/dev">← Games</a><div><button id="sound" type="button" aria-pressed="false">Sound off</button><select id="language" aria-label="Language / Език"><option value="en">English</option><option value="bg">Български</option></select></div></nav>
<canvas id="canvas" aria-label="Draw one circle using a mouse, pen or touch."></canvas>
<canvas id="particles" aria-hidden="true"></canvas>

<div id="hud" role="status" aria-live="polite" aria-atomic="true">
  <div id="score">0.0%</div>
  <div id="details">Draw a circle to begin</div>
  <div id="leaderboard"></div>
</div>

<div id="instructions">HOLD & DRAW</div>

<p class="draw-note" id="draw-note">Mouse, pen or touch · Finish where you started · Scores stay on this device</p>
<script type="module">
import { scoreCircle, cleanScores } from './scoring.mjs?v=20261008a';
/** * AUDIO SYSTEM (Synthesizer)
 */
let audioCtx = null;
let soundEnabled = false;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const copy = {
 en: { back: '← Games', start: 'Draw a circle to begin', draw: 'HOLD & DRAW', again: 'DRAW AGAIN', small: 'Draw a larger, complete circle.', best: '🏆 BEST: ', empty: 'No high scores yet', soundOn: 'Sound on', soundOff: 'Sound off', note: 'Mouse, pen or touch · Finish where you started · Scores stay on this device', comments: ['Keep practising!', 'Not bad!', 'Excellent!', 'Masterpiece!', 'Almost perfect!'] },
 bg: { back: '← Игри', start: 'Нарисувайте кръг, за да започнете', draw: 'ЗАДРЪЖТЕ И РИСУВАЙТЕ', again: 'ОПИТАЙТЕ ПАК', small: 'Нарисувайте по-голям, затворен кръг.', best: '🏆 РЕКОРД: ', empty: 'Все още няма рекорди', soundOn: 'Със звук', soundOff: 'Без звук', note: 'Мишка, писалка или докосване · Завършете там, откъдето започнахте · Рекордите се пазят на това устройство', comments: ['Опитайте пак!', 'Добър опит!', 'Отлично!', 'Шедьовър!', 'Почти съвършено!'] }
};
let language = new URLSearchParams(location.search).get('lang') === 'bg' ? 'bg' : 'en';
let lastResult = null;
const t = key => copy[language][key];

function playSound(type, val) {
    if (!soundEnabled) return;
    try {
      const AudioConstructor = window.AudioContext || window.webkitAudioContext;
      if (!AudioConstructor) return;
      audioCtx ||= new AudioConstructor();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    } catch { return; }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'draw') {
        // A low hum that rises as you draw longer
        osc.type = 'sine';
        osc.frequency.setValueAtTime(100 + (val * 2), now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'score') {
        // Chime based on score (Higher score = Higher pitch)
        osc.type = val > 90 ? 'triangle' : 'sine';
        const freq = 200 + (val * 8); 
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.1); // "Ding" effect
        
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        
        osc.start(now);
        osc.stop(now + 1.5);
    }
}

/** * MAIN GAME LOGIC 
 */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const particleCanvas = document.getElementById("particles");
const pctx = particleCanvas.getContext("2d");

let w, h;
let drawing = false;
let pointerId = null;
function resize() {
    drawing = false;
    pointerId = null;
    w = window.innerWidth;
    h = window.innerHeight;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = particleCanvas.width = w * ratio;
    canvas.height = particleCanvas.height = h * ratio;
    ctx.scale(ratio, ratio);
    pctx.scale(ratio, ratio);
    
    // Reset visual state on resize
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}
window.addEventListener("resize", resize);
resize();

let points = [];
let particles = [];
let scores = [];
try { scores = cleanScores(localStorage.getItem('circleScores')); } catch { /* Storage is optional. */ }

// Update initial leaderboard text
updateLeaderboardUI();

function start(e) {
    if (drawing || (e.pointerType === "mouse" && e.button !== 0)) return;
    e.preventDefault();
    pointerId = e.pointerId;
    canvas.setPointerCapture(pointerId);
    drawing = true;
    points = [];
    
    // Clear canvas instantly for a fresh attempt
    ctx.clearRect(0, 0, w, h);
    
    // Reset UI style
    document.getElementById("score").style.color = "#fff";
    document.getElementById("instructions").hidden = true;
    
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    points.push(pos);
}

function draw(e) {
    if (!drawing || e.pointerId !== pointerId || points.length >= 5000) return;
    e.preventDefault();
    
    const pos = getPos(e);
    if (Math.hypot(pos.x - points.at(-1).x, pos.y - points.at(-1).y) < 1) return;
    points.push(pos);

    // Audio feedback based on stroke length
    if (points.length % 5 === 0) playSound('draw', points.length);

    // Dynamic Color: Starts Blue, turns Cyan, then White
    const hue = (200 + points.length) % 360;
    ctx.strokeStyle = `hsl(${hue}, 80%, 70%)`;
    ctx.lineWidth = 4;
    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsl(${hue}, 80%, 50%)`;

    ctx.beginPath();
    ctx.moveTo(points.at(-2).x, points.at(-2).y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    
    // Spawn trail particles
    if (Math.random() > 0.5) spawnParticle(pos.x, pos.y, `hsl(${hue}, 80%, 50%)`);
}

function end(e) {
    if (!drawing || (e && e.pointerId !== pointerId)) return;
    drawing = false;
    pointerId = null;
    document.getElementById("instructions").hidden = false;
    document.getElementById("instructions").textContent = t('again');
    const result = scoreCircle(points);
    if (!result) {
      document.getElementById('score').textContent = '0.0%';
      document.getElementById('details').textContent = t('small');
      lastResult = null;
      return;
    }
    displayResult(result.score, result.cx, result.cy, result.radius);
}

function getPos(e) {
    if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    if (e.changedTouches && e.changedTouches.length > 0) {
        return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
}

/**
 * MATH & SCORING
 */
function displayResult(score, cx, cy, r) {
    lastResult = score;
    playSound('score', score);

    const scoreEl = document.getElementById("score");
    const detailsEl = document.getElementById("details");

    // Color grading based on score
    let color = "#ff4d4d"; // Red (Bad)
    let comment = t('comments')[0];
    
    if (score > 80) { color = "#ff9f43"; comment = t('comments')[1]; } // Orange
    if (score > 90) { color = "#00d2d3"; comment = t('comments')[2]; } // Cyan
    if (score > 95) { color = "#54a0ff"; comment = t('comments')[3]; } // Blue
    if (score > 98) { color = "#ffd700"; comment = t('comments')[4]; } // Gold

    scoreEl.innerText = score.toFixed(1) + "%";
    scoreEl.style.color = color;
    scoreEl.style.textShadow = `0 0 20px ${color}`;
    
    // Visual Pop Effect
    scoreEl.style.transform = reducedMotion.matches ? "none" : "scale(1.5)";
    setTimeout(() => scoreEl.style.transform = "scale(1)", 200);

    detailsEl.innerText = comment;
    detailsEl.style.color = color;

    // Draw the "Ghost" Ideal Circle for comparison
    drawIdealCircle(cx, cy, r, color);
    
    // Save to leaderboard
    saveScore(score);
    
    // Explosive particles for good scores
    if (score > 90) explodeParticles(cx, cy, color);
}

function drawIdealCircle(x, y, r, color) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]); // Dashed line
    ctx.stroke();
    ctx.setLineDash([]); // Reset
    ctx.globalAlpha = 1.0;
}

function saveScore(score) {
    scores = [...scores, score].sort((a, b) => b - a).slice(0, 5);
    try { localStorage.setItem('circleScores', JSON.stringify(scores)); } catch { /* Keep the current session playable. */ }
    updateLeaderboardUI();
}

function updateLeaderboardUI() {
    document.getElementById('leaderboard').textContent = scores.length ? t('best') + scores[0].toFixed(1) + '%' : t('empty');
}

/**
 * PARTICLE SYSTEM
 */
function spawnParticle(x, y, color) {
    if (reducedMotion.matches || document.hidden) return;
    startParticles();
    particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        life: 1.0,
        color: color
    });
}

function explodeParticles(x, y, color) {
    if (reducedMotion.matches || document.hidden) return;
    startParticles();
    for(let i=0; i<50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            decay: 0.02,
            color: color
        });
    }
}

let frame = null;
function startParticles() { if (frame === null) frame = requestAnimationFrame(loop); }
function loop() {
    frame = null;
    pctx.clearRect(0, 0, w, h);
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= (p.decay || 0.05); // Default decay is fast for trail
        
        pctx.globalAlpha = Math.max(0, p.life);
        pctx.fillStyle = p.color;
        pctx.beginPath();
        pctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        pctx.fill();
        
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    if (particles.length && !document.hidden && !reducedMotion.matches) startParticles();
}

canvas.addEventListener('pointerdown', start);
canvas.addEventListener('pointermove', draw);
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', () => { drawing = false; pointerId = null; document.getElementById('instructions').hidden = false; });
canvas.addEventListener('lostpointercapture', () => { drawing = false; pointerId = null; });
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      drawing = false; pointerId = null; particles = [];
      cancelAnimationFrame(frame); frame = null;
      pctx.clearRect(0, 0, w, h);
    }
});
function translate() {
    document.documentElement.lang = language;
    document.title = language === 'bg' ? 'Съвършеният кръг' : 'Perfect Circle Challenge';
    document.getElementById('language').value = language;
    document.getElementById('back').textContent = t('back');
    document.getElementById('back').href = '/dev?lang=' + language;
    document.getElementById('draw-note').textContent = t('note');
    document.getElementById('instructions').textContent = t(points.length ? 'again' : 'draw');
    document.getElementById('details').textContent = lastResult === null ? t('start') : t('comments')[lastResult > 98 ? 4 : lastResult > 95 ? 3 : lastResult > 90 ? 2 : lastResult > 80 ? 1 : 0];
    canvas.setAttribute('aria-label', language === 'bg' ? 'Нарисувайте кръг с мишка, писалка или докосване.' : 'Draw one circle using a mouse, pen or touch.');
    document.querySelector('.toolbar').setAttribute('aria-label', language === 'bg' ? 'Настройки на играта' : 'Game controls');
    updateSound(); updateLeaderboardUI();
}
function updateSound() {
    document.getElementById('sound').textContent = t(soundEnabled ? 'soundOn' : 'soundOff');
    document.getElementById('sound').setAttribute('aria-pressed', String(soundEnabled));
}
document.getElementById('language').addEventListener('change', event => {
    language = event.target.value;
    const url = new URL(location.href); url.searchParams.set('lang', language); history.replaceState(null, '', url);
    translate();
});
document.getElementById('sound').addEventListener('click', () => { soundEnabled = !soundEnabled; updateSound(); if (soundEnabled) playSound('draw', 0); else audioCtx?.suspend().catch(() => {}); });
translate();
</script>
</body>
</html>
