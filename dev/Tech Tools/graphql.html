  <style>
    :root { --bg-body: #0a0d12; --text-primary: #f0f6fc; --accent-ql: #e535ab; --font-mono: monospace; }
    body { background: var(--bg-body); color: var(--text-primary); font-family: sans-serif; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .playground { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem; }
    
    .editor { background: #161b22; border: 1px solid #333; padding: 1rem; border-radius: 8px; font-family: var(--font-mono); }
    .json-out { color: #a5d6ff; white-space: pre; }
    .keyword { color: var(--accent-ql); font-weight: bold; }
    
    .btn { background: var(--accent-ql); border: none; color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
      * { box-sizing: border-box; }
    textarea.editor { display: block; width: 100%; color: #f0f6fc; resize: vertical; font: 15px/1.6 monospace; }
    .json-out { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 180px; }
    :focus-visible { outline: 3px solid #e535ab; outline-offset: 3px; }
    @media (max-width: 650px) { body { padding: 1rem; } .playground { grid-template-columns: 1fr; } }
</style>

<body>
  <div class="container">
    <div style="margin-bottom:1rem;"><a href="index.html" style="color:#8b949e; text-decoration:none;">← Back</a></div>
    <h1 style="color:var(--accent-ql)">GraphQL Playground</h1>
    <p>Select response fields in a GraphQL-style query. This local teaching mock supports user(id: 1) with name, email, age and posts { title }; it does not connect to a server or execute arbitrary GraphQL.</p>

    <div class="playground">
      <div>
        <h3>Query</h3>
        <label for="queryInput">Edit the sample query</label>
        <textarea class="editor" id="queryInput" spellcheck="false" rows="9">query {
  user(id: 1) {
    name
    email
  }
}</textarea>
        <button class="btn" onclick="fetchData()">Run Query ▶</button>
      </div>

      <div>
        <h3>Response (JSON)</h3>
        <div class="editor json-out" id="output" role="status">...</div>
      </div>
    </div>
  </div>

  <script>
    function fetchData() {
      const q = document.getElementById('queryInput').value.trim();
      const output = document.getElementById('output');
      const error = message => { output.textContent = JSON.stringify({ errors: [{ message }] }, null, 2); };
      if (q.length > 2000) return error('Keep the sample query under 2,000 characters.');
      const match = q.match(/^(?:query(?:\s+[A-Za-z_]\w*)?\s*)?\{\s*user\s*\(\s*id\s*:\s*1\s*\)\s*\{([\s\S]*?)\}\s*\}$/);
      if (!match) return error('This mock supports only query { user(id: 1) { name email age posts { title } } }.');
      const hasPosts = /\bposts\s*\{\s*title\s*\}/.test(match[1]);
      const fields = match[1].replace(/\bposts\s*\{\s*title\s*\}/g, ' ').trim().split(/[\s,]+/).filter(Boolean);
      if ((!fields.length && !hasPosts) || fields.some(field => !['name', 'email', 'age'].includes(field))) return error('Choose name, email, age or posts { title }. Other fields are not implemented in this mock.');
      const sample = { name: 'Alice', email: 'alice@example.com', age: 29 };
      const data = Object.fromEntries(fields.map(field => [field, sample[field]]));
      if (hasPosts) data.posts = [{ title: 'Hello World' }];
      output.textContent = JSON.stringify({ data: { user: data } }, null, 2);
    }

  </script>
</body>
